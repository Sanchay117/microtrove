# Runs the Microtrove keeper every five minutes on GitHub's runners: one scan per run,
# liquidating what is due and paying the withdrawal queue. Alert history is carried
# between runs in the Actions cache so the same alert is not sent every five minutes.
#
# Needs the repository secret KEEPER_PRIVATE_KEY (a testnet wallet holding MUSD and a
# little BTC) and optionally ALERT_WEBHOOK_URL, ALERT_TELEGRAM_BOT_TOKEN and
# ALERT_TELEGRAM_CHAT_ID. Without a key it only watches.
name: keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keeper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: keeper/.state.json
          key: keeper-state-${{ github.run_id }}
          restore-keys: keeper-state-
      - name: Scan once
        run: npm run once
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.ALERT_TELEGRAM_BOT_TOKEN }}
          ALERT_TELEGRAM_CHAT_ID: ${{ secrets.ALERT_TELEGRAM_CHAT_ID }}
          STATE_FILE: .state.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: keeper/.state.json
          key: keeper-state-${{ github.run_id }}
